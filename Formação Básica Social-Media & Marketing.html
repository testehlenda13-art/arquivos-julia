label.mut{display:block;margin-top:8px}textarea{min-height:90px;resize:vertical}select{max-width:100%}

<script>
const F40="Falando à Câmera|Storytelling|Tela Verde|Papel e Caneta|Respondendo Comentário|Bastidores|Entrevista de Rua|Antes e Depois|Compartilhando Tela|React|Quadro Branco|Listas|POV|Estudo de Caso|Conversa por Chamada|App de Notas|Corte de Podcast|Mitos e Verdades|Vlog|Tweet na Tela|Walk & Talk|Framework|Print|Comparativo|Rotina|Tela Dividida|Carrossel Educativo|Análise de Perfil|Trend Adaptada|Frases|B-Roll|Checklist|Encenação|Ranking|Desafio|Collab|Revelação|No Carro|Q&A|Vlog 2".split("|");
const G39="Fofoca|Estudo Fictício|Use Isso para Isso|Quadro Branco|A+B+C|Tela Verde|Talking Head|Mind Map|Tier List|Tela na Tela|Musical|Explicado para Crianças|Reunião|Caixinha de Perguntas|Erro Comum|Lista|Cinemático|Selfie no Espelho|Podcast|Stories Nativo|Depoimento|POV|Vlog|Passo a Passo|Mitos e Verdades|Exercícios|Resposta a Comentário|Bastidores do Dia|Giro de Notícia|Péssimo / Bom / Excelente|Antes e Depois|Tablet na Mão|UGC|Carrossel|Clone|Vídeo Escrito|Narrado|Build in Public|Cronômetro".split("|");
const EX1={"Falando à Câmera":"Em 20 segundos, explique o que é o plano grátis do ORION.","Tela Verde":"A notícia do concurso atrás de você, e você comenta.","Papel e Caneta":"Desenhe ao vivo a diferença entre posto e graduação.","Respondendo Comentário":"Alguém pergunta “é grátis?” e você responde em vídeo.","Bastidores":"Mostre como você prepara os posts da semana.","Compartilhando Tela":"Grave a tela usando o painel de questões.","Mitos e Verdades":"“Estudar 10 horas por dia garante aprovação?” Mito. Ajuda mais treinar questões e revisar o que errou.","Carrossel Educativo":"Checklist do edital em 6 slides.","Trend Adaptada":"Som do momento + situação de estudo.","Checklist":"O que conferir quando o edital sair.","Ranking":"As matérias que você acha mais difíceis, do 5º ao 1º."};
const EX2={"Erro Comum":"O erro de quem estuda sem revisar o que errou.","Explicado para Crianças":"Explique o que é edital como se falasse com um menino de 13 anos.","Tier List":"Matérias da mais fácil à mais difícil, na sua opinião.","Caixinha de Perguntas":"Responda as dúvidas que chegarem nos Stories.","Passo a Passo":"Como criar a conta grátis em 3 passos.","Giro de Notícia":"Resumo semanal do concurso, sempre com “confirme no edital”.","Cronômetro":"Resolva uma questão em 30 segundos, na tela.","Depoimento":"Só com aluna real e autorização por escrito.","UGC":"Só com pessoa real e autorização por escrito."};
const GL=[["CPA","Custo por aquisição: quanto custa para 1 pessoa comprar. Gastou R$ 100 e 5 compraram? CPA = R$ 20."],["CPM","Custo por mil impressões: quanto você paga para o anúncio aparecer 1.000 vezes."],["CPC","Custo por clique: quanto custa cada clique no anúncio."],["CTR","Taxa de clique: de 100 pessoas que viram, quantas clicaram. 2 cliques em 100 = 2%."],["ROAS","Retorno: para cada R$ 1 colocado, quanto volta. R$ 100 virou R$ 300? ROAS 3."],["LTV","Quanto uma pessoa gasta no total com o ORION, somando todas as compras."],["CAC","Custo para conseguir 1 cliente. Aqui é o mesmo que o CPA."],["CTA","Chamada para ação: “Clica no link”, “Comenta C ou E”."],["UGC","Vídeo que parece feito por gente normal, não por empresa."],["TOFU / MOFU / BOFU","Topo, meio e fundo do funil: quem ainda não conhece, quem está pensando e quem está pronto para comprar."],["FTIR","Quantas pessoas novas viram seu anúncio pela 1ª vez."],["CAPI","API de Conversões: o servidor do site avisa o Meta direto sobre uma compra."],["Pixel","Código no site que avisa a plataforma quem visitou ou comprou."],["Hook","Os 3 primeiros segundos, que decidem se a pessoa fica."],["Payoff","A recompensa no final do vídeo, a resposta que a pessoa esperou."],["Retenção","Quanto tempo a pessoa ficou assistindo."],["Skip Rate","Quantas pessoas pularam o vídeo logo no início."]];
const Q=(q,o,a,e)=>({q,o,a,e});
const L=[
{id:"1-1",tr:1,t:"1.1 O que é ser Social Media?",v:"Pense numa lanchonete. O dono faz o lanche, mas alguém precisa chamar a rua para entrar, atender quem chega e ver qual lanche vende mais. Na internet, essa pessoa é o social media. São 5 tarefas: planejar o que postar, gravar, postar, responder comentários e mensagens (DM) e olhar o que deu certo para repetir.",life:"Como quem cuida da vitrine de uma loja: arruma, chama a atenção e conversa com quem para.",ex:"Rotina diária do ORION: 1 Reels por dia, 3 Stories e responder todo comentário em até 1 hora.",tk:["Escrever as 5 tarefas do dia com suas palavras","Criar um alarme para checar comentários","Definir o horário fixo de gravar e postar"],q:[Q("Qual tarefa NÃO é do social media?",["Planejar posts","Responder comentário","Programar o site"],2,"Ele cuida de conteúdo e conversa, não do código."),Q("Em quanto tempo responder cada comentário?",["Até 1 hora","Em 1 semana","Só quando der"],0,"Responder rápido mostra que o perfil está vivo."),Q("Quantos Reels por dia na rotina do ORION?",["1","10","0"],0,"A rotina é 1 Reels e 3 Stories por dia.")]},
{id:"1-2",tr:1,t:"1.2 Os 40 formatos de conteúdo",x:"f40",v:"Formato é um molde de vídeo, como a forma de um bolo: muda o recheio (o assunto), mas o jeito de fazer é o mesmo. Quem conhece muitos moldes nunca fica sem ideia. Toque nos formatos abaixo e veja como aplicar ao ORION.",life:"A mesma massa vira bolo de cenoura ou de chocolate, só trocando o recheio.",ex:"Mitos e Verdades: pegue uma crença comum de quem estuda e diga se é mito ou verdade.",tk:["Escolher 3 formatos para a primeira semana","Anotar 1 ideia do ORION para cada um","Gravar um teste no formato mais fácil"],q:[Q("O que é um formato?",["Um molde de vídeo","Um programa de edição","Um tipo de anúncio"],0,"É o jeito de contar, e o assunto pode mudar."),Q("Para que serve conhecer vários formatos?",["Nunca ficar sem ideia","Postar sempre o mesmo vídeo","Gastar menos tempo"],0,"Mais moldes, mais ideias."),Q("No Mitos e Verdades, você…",["Confirma ou desmente uma crença","Só dança","Lê o edital inteiro"],0,"É isso: crença, resposta e explicação.")]},
{id:"1-3",tr:1,t:"1.3 Os 39 formatos do Gaki",x:"g39",v:"Segunda lista de moldes, para os dias em que a cabeça trava. A regra é a mesma: escolha um molde, troque o assunto pelo mundo dos concursos e grave. Toque nos formatos para ver a ideia.",life:"Quando você não sabe o que cozinhar, abrir o caderno de receitas resolve.",ex:"Erro Comum: “O erro de quem estuda sem revisar o que errou.”",tk:["Escolher 3 formatos novos que ainda não usou","Montar a ideia de um deles com o tema do ORION","Marcar quais precisam de autorização (UGC e Depoimento)"],q:[Q("Quando usar a lista de 39?",["Quando travar nas ideias","Só em anúncio","Nunca"],0,"Ela existe para destravar."),Q("Depoimento e UGC exigem…",["Pessoa real e autorização por escrito","Atriz contratada","Nada"],0,"Não se inventa depoimento."),Q("No Erro Comum você mostra…",["O erro mais comum e como evitar","Só o seu rosto","Um preço"],0,"Erro, motivo e jeito certo.")]},
{id:"1-4",tr:1,t:"1.4 Como viralizar (Virality 101)",x:"tab",v:"Viralizar é muita gente assistir. A regra do material do EkkoBuild: quanto mais amplo e mais parecido com uma história, mais gente assiste. Quanto mais específico e só sobre você, menos gente para. Skip rate é a porcentagem que pula o vídeo.",life:"Uma piada que todo mundo entende alcança mais gente do que uma piada interna da sua turma.",ex:"Amplo + história: “Estudei 4 horas e errei tudo.” Específico demais: “Meu plano de 12 etapas só sobre mim.”",tk:["Reescrever 3 ideias suas deixando-as mais amplas","Transformar 1 ideia em mini-história","Cortar um vídeo seu para ficar entre 10 e 35 segundos"],q:[Q("Qual alcança mais gente?",["Amplo + história","Específico demais","Só fala de você"],0,"Amplo e em forma de história lidera a tabela."),Q("Skip rate é…",["% que pula o vídeo","Número de curtidas","Preço do anúncio"],0,"Quanto menor, melhor."),Q("Pela tabela, vídeos mais virais têm…",["10 a 15 segundos","60+ segundos","Sempre 2 minutos"],0,"Curtos e amplos vão mais longe.")]},
{id:"1-5",tr:1,t:"1.5 Retenção: fazer ficar até o fim",x:"ret",v:"O problema quase nunca é o hook, é o que vem depois. Estrutura: Hook (0–3 s), pergunta ou atraso, rehook (um novo motivo para ficar), pergunta 2 e a resposta (payoff) só no fim. Nunca entregue a resposta no começo. Três métodos de hook estão abaixo.",life:"Série boa: termina o episódio com um mistério, e você fica para ver.",ex:"“A maioria dos concurseiros reprova porque…” (hook de dor), e a resposta vem só no final do vídeo.",tk:["Escrever 3 hooks do ORION, um de cada tipo","Gravar um vídeo com rehook no meio","Mostrar os hooks ao gestor antes de virar anúncio"],q:[Q("Onde fica a resposta do vídeo?",["No final","Nos 3 primeiros segundos","Em lugar nenhum"],0,"Payoff é a recompensa de quem ficou."),Q("“O motivo de X é Y” é qual hook?",["Do Motivo","De Dor","Presta Atenção"],0,"Ex.: “O motivo da reprovação é o método.”"),Q("Um vídeo bom no gráfico…",["Desce devagar","Cai a 0% em 3 s","Sobe sempre"],0,"Descida suave = gente ficando.")]},
{id:"2-1",tr:2,t:"2.1 Dicionário das siglas",x:"glos",v:"Anúncio tem muita sigla, mas quase tudo é conta de padaria. Se você vende 5 pães e gastou R$ 100 em panfleto, cada pão custou R$ 20 de divulgação. Isso é o CPA. Veja as 17 siglas abaixo.",life:"Panfleto na padaria: gasto, quantos vieram e quanto custou cada um.",ex:"Gastou R$ 100 no anúncio do ORION e 5 pessoas compraram? CPA de R$ 20.",tk:["Explicar 5 siglas em voz alta, como para uma criança","Calcular um CPA com números inventados","Fazer um cartão com as siglas e deixar à vista"],q:[Q("R$ 100 gastos e 5 compras. CPA?",["R$ 20","R$ 5","R$ 500"],0,"100 ÷ 5 = 20."),Q("CTR mede…",["Quem clicou entre quem viu","O preço do clique","O tempo de vídeo"],0,"2 cliques em 100 = 2%."),Q("ROAS 3 significa…",["Cada R$ 1 voltou R$ 3","Gastou R$ 3","3 cliques"],0,"Retorno sobre o gasto.")]},
{id:"2-2",tr:2,t:"2.2 Meta Ads: o algoritmo de 2026",v:"Segundo o material do Thyago Yamauti, arte muito produzida deixou de funcionar, vídeo melhora um pouco e foto real com fonte de Stories é excelente. O algoritmo prefere o que parece orgânico, como post de amigo. Meta Ads são os anúncios do Facebook e do Instagram.",life:"Você para mais em um recado de amigo do que em um outdoor.",ex:"Regra do ORION: o anúncio parece um Story, não um outdoor. Foto real, letra simples, conversa direta.",tk:["Pegar 3 Stories seus e imaginar como anúncio","Trocar uma arte cheia de detalhes por foto real","Escrever o texto com a sua voz"],q:[Q("O que o algoritmo prefere hoje?",["Parecer orgânico","Arte superproduzida","Muito texto"],0,"Simples e natural."),Q("Melhor aparência para o anúncio?",["De Story","De outdoor","De catálogo"],0,"Regra do ORION."),Q("Meta Ads são anúncios de…",["Facebook e Instagram","Só do Google","Só do TikTok"],0,"Todos dentro da Meta.")]},
{id:"2-3",tr:2,t:"2.3 Diversificação criativa × iteração",x:"pizza",v:"Imagine uma pizza: todos os seus possíveis compradores. Um formato só (por exemplo, UGC básico) alcança uma fatia, os Responders. Dez variações do mesmo vídeo só dividem a mesma fatia em pedaços menores, e o CPA sobe. Formatos diferentes abrem uma fatia nova, os Non-Responders.",life:"Vender só sorvete de chocolate: dez embalagens não atraem quem prefere morango.",ex:"Em vez de 10 versões de “Falando à Câmera”, faça 1 Mitos e Verdades, 1 Tela Verde, 1 Carrossel…",tk:["Listar 5 formatos diferentes para o ORION","Marcar quais são só uma variação do mesmo","Escolher 3 para testar"],q:[Q("10 vídeos iguais, só muda o hook, é…",["Dividir a mesma fatia","Abrir fatia nova","Escalar barato"],0,"Iteração demais sobe o CPA."),Q("Formatos diferentes alcançam…",["Non-Responders","Só quem já comprou","Ninguém"],0,"São as fatias novas da pizza."),Q("Para escalar com CPA baixo…",["10 criativos diferentes","10 cópias","1 só"],0,"Diversifique.")]},
{id:"2-4",tr:2,t:"2.4 Os 10 conceitos de Meta Ads",x:"c10",v:"Dez ideias que sustentam bons anúncios, segundo o material da Evelyn Weiss. Leia cada card, tente explicar com palavras suas e depois ligue ao ORION.",life:"Como regras de um jogo: dá para jogar sem saber, mas quem sabe ganha.",ex:"Regra dos 7: quem viu seu anúncio hoje pode comprar só na 7ª vez. Por isso o remarketing existe.",tk:["Explicar 3 conceitos a alguém de casa","Ligar cada um a um exemplo do ORION","Descobrir a fase de consciência de um seguidor"],q:[Q("Pixel + CAPI é…",["Melhor usar juntos","Coisas iguais","Só para o TikTok"],0,"Um complementa o outro."),Q("Regra dos 7 diz que…",["A pessoa precisa ver ~7 vezes","Postar 7 vezes por dia","Gastar R$ 7"],0,"Repetição gera confiança."),Q("Creative First Optimization é…",["O criativo faz o trabalho","O botão é o mais importante","Mudar o público sempre"],0,"A peça é o que mais pesa.")]},
{id:"2-5",tr:2,t:"2.5 TikTok Ads (resumo)",v:"A lógica é a do Meta, mas o vídeo precisa ser ainda mais nativo e rápido: hook em 1 segundo e uso de trends. Para adaptar um criativo do Meta, corte a introdução, use 9:16 e deixe o texto fora das áreas cobertas pelos botões.",life:"Mesma receita, mas servida mais rápido e mais quente.",ex:"Pegue seu Reels campeão, comece direto na pergunta e coloque um som em alta.",tk:["Pegar 1 vídeo do Meta e cortar a intro","Testar hook de 1 segundo","Conferir a pré-visualização do TikTok"],q:[Q("Hook no TikTok em…",["1 segundo","10 segundos","Só no fim"],0,"O ritmo é mais veloz."),Q("O que muda do Meta para o TikTok?",["Mais nativo e rápido","Nada","Só o logo"],0,"Mesma lógica, ritmo diferente."),Q("Formato ideal do TikTok?",["9:16","1:1 sempre","16:9"],0,"Vertical.")]},
{id:"2-6",tr:2,t:"2.6 Google Ads (só o básico)",v:"No Meta, o anúncio interrompe a pessoa. No Google, ela mesma pesquisa algo, como “questões PMBA”, e seu anúncio aparece ali. Use quando já há gente procurando. Só o conceito, nada mais.",life:"Placa na rua (Meta) versus ser o primeiro nome na lista telefônica (Google).",ex:"Alguém digita “questões PMBA” e aparece o ORION.",tk:["Pesquisar 3 termos do ORION no Google","Anotar quem aparece em cima","Explicar a diferença com suas palavras"],q:[Q("No Google Ads a pessoa…",["Pesquisa e vê o anúncio","É interrompida","Não pesquisa"],0,"Ela já procurava."),Q("Meta, em comparação, é…",["Interrupção","Pesquisa","Rádio"],0,"Aparece no meio do que você via."),Q("Quando usar o Google?",["Quando há procura","Nunca","Só no TikTok"],0,"Há demanda, há busca.")]},
{id:"1-6",tr:1,t:"1.6 Conhecer o ORION e responder comentários e DMs",x:"faq",v:"Quem comenta quer uma resposta rápida, simpática e verdadeira. Para isso, você precisa conhecer o produto. DM é a mensagem privada. Regras: responda com o jeito do público, nunca invente uma informação e, se não souber, diga “vou confirmar e já te respondo”. Depois pergunte ao gestor.",life:"Como a atendente de uma loja: simpática, rápida e honesta. Se não sabe o preço, vai perguntar ao dono.",ex:"Comentário: “é grátis mesmo?” Resposta: “É sim! O plano Base é grátis. Cria sua conta pelo link da bio 💜”.",tk:["Escrever com suas palavras o que é o ORION em 2 frases","Adaptar 3 respostas-modelo ao seu jeito de falar","Combinar com o gestor quando ele quer ser avisado"],q:[Q("Não sabe a resposta. O que fazer?",["Inventar algo bom","Dizer que vai confirmar e perguntar ao gestor","Ignorar o comentário"],1,"Informação errada gera reclamação."),Q("Alguém pergunta: “vou passar usando o ORION?”",["Prometer que sim","Dizer que nenhum site garante aprovação e que o ORION ajuda a treinar","Apagar o comentário"],1,"Nunca prometa aprovação."),Q("Quando passar a conversa ao gestor?",["Pagamento, reembolso ou ofensa grave","Quando alguém elogia","Nunca"],0,"Dinheiro, conta e ofensa são com o gestor.")]},
{id:"2-7",tr:2,t:"2.7 O Gerenciador de Anúncios na prática",x:"ger",v:"Gerenciador de Anúncios é o painel da Meta onde o anúncio é criado e acompanhado. Ele tem três andares: a campanha (o objetivo), o conjunto de anúncios (público, orçamento, onde aparece e datas) e o anúncio (a peça, o texto e o link). Orçamento é quanto dinheiro você deixa gastar por dia. Veja a estrutura e treine a leitura dos números.",life:"Como um prédio: o prédio é a campanha, cada andar é um conjunto e cada apartamento é um anúncio.",ex:"Campanha com objetivo de cadastros grátis no ORION. Conjunto 1: pessoas interessadas em concursos. Anúncios: 3 criativos diferentes.",tk:["Desenhar a hierarquia campanha, conjunto e anúncio","Calcular CTR, CPC e CPA do exercício","Explicar ao gestor qual anúncio pausaria e por quê"],q:[Q("Onde ficam o público e o orçamento?",["No conjunto de anúncios","No criativo","No pixel"],0,"Cada conjunto tem o seu público e o seu orçamento."),Q("O melhor CTR é sempre o melhor anúncio?",["Não, olhe também o CPA","Sim","Só olhe os cliques"],0,"Clique não é cadastro."),Q("Quem aprova o orçamento e a publicação?",["O gestor","Ninguém","A aluna sozinha"],0,"Regra da casa: você prepara e analisa, ele aprova.")]},
{id:"2-8",tr:2,t:"2.8 Diário de testes e conferência das regras",x:"dia",v:"Um teste A/B compara duas versões mudando só uma coisa, por exemplo só o hook, para saber o que causou a diferença. Se mudar tudo de uma vez, você não descobre o que funcionou. Anote cada teste no diário. E confira se as regras dos cursos batem com os números reais do ORION: os dados da conta ensinam mais do que qualquer tabela.",life:"Testar dois molhos no mesmo lanche. Se trocar molho e pão juntos, não sabe qual agradou.",ex:"Mesmo vídeo, hook A “Se você vai fazer PMBA, presta atenção” e hook B “A maioria dos concurseiros reprova porque…”. Só o hook muda.",tk:["Rodar 1 teste A/B de hook","Preencher uma linha do diário","Marcar “bate” ou “não bate” em 2 regras"],q:[Q("Em um teste A/B, o que muda?",["Só uma coisa","Tudo","Nada"],0,"Assim você sabe o que causou o resultado."),Q("A regra do curso não bate com os dados do ORION?",["Anote e confie nos dados do ORION","Ignore os números","Apague o post"],0,"Os dados da conta valem mais."),Q("Para que serve o diário?",["Aprender com cada teste","Enfeitar","Postar mais"],0,"Sem anotar, o aprendizado se perde.")]},
{id:"final",tr:3,t:"Módulo final: prática do ORION",x:"cal",v:"Hora de provar o que aprendeu. Monte sozinha o calendário de 7 dias do ORION, com um formato e um hook por dia, e acerte pelo menos 80% do quiz final.",life:"Como a prova de direção: teoria e prática.",ex:"Dias 1 a 7: 3 formatos diferentes. Dias 8 a 14: 3 hooks do Arthur. Dias 15 a 30: 5 criativos diferentes para Meta Ads e análise do CPA.",tk:["Calendário com os 7 dias preenchidos","Cada dia com formato e hook","Quiz final com 80% ou mais"],q:[Q("Ordem da retenção?",["Hook, pergunta, rehook, payoff","Payoff primeiro","Só hook"],0,"A resposta vem no fim."),Q("R$ 60 gastos, 3 compras. CPA?",["R$ 20","R$ 180","R$ 3"],0,"60 ÷ 3 = 20."),Q("Mais criativo, menos CPA:",["Formatos diferentes","Cópias do mesmo","Só arte bonita"],0,"Abre fatia nova."),Q("Quem vê o anúncio ao pesquisar?",["Google Ads","Meta Ads","Rádio"],0,"A pessoa procurava."),Q("Anúncio ideal na Meta em 2026?",["Parece Story","Parece outdoor","Parece folheto"],0,"Orgânico.")]}];

const HKC=[["Quebra de consenso",["Vou falar uma coisa que muita gente da minha área não vai gostar...","A gente normalizou [X], mas será que deveria?","Todo mundo concorda com [X]. Eu tenho uma opinião completamente diferente.","Quando foi que começamos a achar [X] normal?","Eu sei que essa opinião vai dividir as pessoas, mas alguém precisa falar."]],
["Escolhas que dividem",["Se você tivesse que escolher apenas [X], qual seria?","Existem dois tipos de pessoas: as que fazem [X] e as que jamais fariam.","Você concorda [A] ou [B]? Não tem como conseguir os dois.","Qual dessas três coisas você eliminaria para sempre?","Você é do time que defende [X] ou do time que odeia [X]?"]],
["Opiniões impopulares",["Opinião impopular: [comportamento comum] é um dos maiores erros que você pode cometer.","Talvez o problema não seja [X], mas algo que ninguém quer admitir.","Eu não consigo entender por que tanta gente ainda defende [X].","Vou defender uma opinião que parece absurda e faz sentido quando você entende o motivo."]],
["Julgamentos",["Quem está errado nessa situação? Quero saber de que lado você ficaria.","Se isso acontecesse com você, qual seria a sua reação?","Isso é uma atitude inteligente ou uma falta de responsabilidade?","Até que ponto [X] é aceitável? Porque para mim, existe um limite."]],
["Identificação / experiências",["Me diz que eu não sou a única pessoa que pensa assim.","Qual foi a maior [situação] que já fizeram / que já aconteceu com você?","Eu tenho uma teoria sobre pessoas que fazem [X]. Quero saber se você concorda.","Qual é uma coisa que todo mundo ama, mas você simplesmente não suporta?","Todo mundo já passou por isso, mas ninguém fala: [situação]."]],
["Debates e previsões",["Daqui a cinco anos, vamos olhar para [X] e achar um absurdo.","Eu aposto que essa tendência vai desaparecer. Você concorda?","Se você pudesse mudar uma única regra sobre [assunto], qual seria?","O que você acha sobre [assunto] que quase ninguém tem coragem de dizer em voz alta?"]]];
const HK=[];HKC.forEach(([c,a])=>a.forEach(t=>HK.push({id:HK.length+1,c,t})));
const CON=["PMESP","PMPE","PMBA","ENEM","Outro"],MAT=["Português","Matemática","Raciocínio Lógico","Direito Constitucional","Direito Penal","Direito Penal Militar","Direito Administrativo","Legislação Específica","Informática","Atualidades","História","Geografia","Biologia","Química","Física","Redação","Outra"],FUN=["Banco de Questões","Simulado","Caderno de Erros","Revisão","Plano de Estudos","Rubi de Evolução","Redação IA","Redação Avançada"],TIP=["Questão Viral","Funcionalidade","Criativo Sem Rosto: Novelinha de Frutas","Criativo Sem Rosto: Card 2D","Criativo Sem Rosto: IA"];
const CTA={"Banco de Questões":"treina questões do seu concurso no Banco de Questões do Orion","Simulado":"faz um Simulado completo no Orion e vê onde você está","Caderno de Erros":"guarda cada erro no Caderno de Erros do Orion e não erra de novo","Revisão":"revisa no tempo certo com a Revisão do Orion","Plano de Estudos":"monta seu Plano de Estudos no Orion","Rubi de Evolução":"acompanha sua evolução no Rubi de Evolução do Orion","Redação IA":"corrige sua redação com a Redação IA do Orion","Redação Avançada":"sobe de nível com a Redação Avançada do Orion"};
const VIS={"Novelinha de Frutas":"novelinha de frutas (personagens-fruta discutindo a questão, voz em off ou legenda)","Card 2D":"card 2D no visual roxo do Orion, texto grande","IA":"imagem/vídeo gerado por IA"};
const CR=["Tem motivo para participar? (pergunta, escolha, debate)","Tem opinião para defender? (posicionamento claro)","Tem experiência para compartilhar? (pede relato)","Tem CTA para funcionalidade do Orion?","Tem filtro de público qualificado? (PMESP/PMPE/PMBA)"];
const FN="(banco de questões|simulado|caderno de erros|revisão|plano de estudos|rubi de evolução|redação ia|redação avançada)";
const RX=[/\?|comenta|vote|escolh/i,/opinião impopular|opinião completamente|discordo|concordo|absurdo|defendo|não suporto|minha posição:|na minha visão/i,/já te|já passou|já aconteceu|me conta|qual foi|seu relato/i,new RegExp("orion[\\s\\S]*"+FN+"|"+FN+"[\\s\\S]*orion","i"),/pmesp|pmpe|pmba/i];
const scr=t=>{const s=RX.map(r=>r.test(t));return{s,n:s.filter(Boolean).length*20}};
const qd=r=>!r.s[3]&&(r.s[0]||r.s[1])?"Viral Vazio":r.n>=85?"Viral Estratégico":r.n>=60?"Autoridade em Construção":"Conteúdo Invisível";
const smsg=n=>n<60?"Conteúdo Invisível ou Viral Vazio - revise o gancho":n<85?"Autoridade em Construção":"Viral Estratégico - pode postar";
const QJ={"Viral Estratégico":"alcance + CTA para o app + público qualificado.","Viral Vazio":"tem motivo para engajar, mas falta CTA para uma funcionalidade do Orion.","Autoridade em Construção":"forma audiência qualificada, mas falta algum ingrediente de alcance ou posicionamento.","Conteúdo Invisível":"faltam gancho, participação e direcionamento."};
const GCOM=[["Lead","Pessoa que mostrou interesse e deixou um contato para a gente falar com ela.","Lead é a porta de entrada do funil: alguém que saiu do anonimato. Lead frio só deixou o contato (clicou no link da bio) e mal conhece o Orion. Lead morno interage, comenta, assiste vários posts. Lead quente pergunta preço ou pede para falar com alguém. Lead qualificado tem perfil (concurso alvo, prova no horizonte, já estuda); desqualificado é curioso fora do público. Lead não é cliente: cliente já pagou.","Concurseiro de PMBA comenta “QUERO” no post, preenche o formulário do teste e deixa o WhatsApp: é lead. Só vira cliente quando assina. Quem clicou no link da bio e sumiu é lead frio.","Chamar seguidor ou curtida de lead, e achar que todo lead está quase comprando.","Custo por lead = gasto ÷ nº de leads. % qualificados = qualificados ÷ leads × 100. Bom: maioria com perfil. Muito lead e pouco qualificado = Viral Vazio.","“Oi! Vi que você pediu o teste do Orion. Você estuda para qual concurso?”","Sem resposta: nova tentativa em 5 min, depois 24h, 3 e 7 dias, cada uma com ângulo diferente (dúvida, conteúdo útil, prova social). Sem retorno, mover para Perdido. Muito desqualificado: revisar gancho e filtro de público."],
["SDR (Sales Development Representative)","Quem liga ou chama o lead para ver se ele tem perfil e marca a conversa.","O SDR não vende: qualifica. Ele existe para o Closer não perder tempo com quem não tem perfil. Entra logo após o lead chegar. Perguntas típicas: qual concurso (PMESP/PMPE)? Quando é a prova? Já estuda? Quanto tempo por dia? Quanto pode investir? Isso é qualificação (BANT: orçamento, autoridade, necessidade e prazo). Passa para o Closer quem tem concurso, prazo e interesse real; descarta quem não tem concurso nem intenção.","SDR chama a lead que fez o teste: “Qual é seu concurso? Quando é a prova? Quantas horas estuda por dia?” Ela estuda para PMESP, prova em 4 meses: marca call com o Closer.","SDR tentar vender na primeira mensagem, ou marcar call com qualquer um para bater meta.","Taxa de qualificação = qualificados ÷ leads contatados; taxa de agendamento = calls marcadas ÷ qualificados. Se muita call marcada vira no-show ou não compra, o filtro está frouxo.","“Oi, aqui é do Orion! Vi que você quer PMESP. Posso te fazer 3 perguntas rápidas para ver como te ajudar?”","Poucos qualificados: ajustar perguntas e origem do lead. Poucos agendamentos: melhorar o convite (benefício da call, horário fácil)."],
["Closer","Quem conduz a call e fecha a venda.","O Closer recebe o lead já qualificado. Na call de fechamento ele descobre a dor, apresenta a solução, contorna objeções e pede a decisão. Diferença: SDR qualifica e agenda; Closer entende a dor e fecha. Quem só mostra funcionalidade e não pergunta nada perde a venda.","Call com concurseiro de PMPE: ele diz que erra a mesma matéria sempre. O Closer mostra o Caderno de Erros, o Plano de Estudos e a Redação IA ligados a essa dor e fecha a assinatura.","Falar o tempo todo e pular a descoberta da dor.","Taxa de fechamento = vendas ÷ calls realizadas × 100. Referência inicial: 20% a 30%; abaixo de 15% revise o roteiro.","“Me conta: o que mais te faz perder ponto hoje? Então olha como o Caderno de Erros resolve isso.”","Fechamento baixo: gravar e revisar calls, treinar descoberta e objeções, conferir se o SDR passa lead fraco."],
["No-show","Quem marcou a call e não apareceu.","Acontece por esquecimento, pouca urgência ou compromisso fraco. Fica entre Call Marcada e Call Realizada. Reduz com confirmação na hora do agendamento, lembrete 24h e 1h antes, prova social e mostrar o que ele leva da call. Quando acontece: mensagem em 10 min oferecendo remarcar e sequência de follow-up em 24h e 3 dias.","Concurseiro marcou call às 19h e sumiu. Às 19h10: “Aconteceu algo? Posso remarcar para amanhã, 20h?”","Achar que no-show é desinteresse total. Muitas vezes é só rotina corrida.","Taxa de no-show = faltas ÷ calls marcadas × 100. Bom: abaixo de 25%. Acima de 40% é problema.","“Te mando um lembrete amanhã de manhã e outro 1h antes. Confirma pra mim?”","Taxa alta: lembretes duplos, confirmação ativa, calls mais próximas do agendamento (em até 48h) e áudio de boas-vindas do Closer."],
["Pitch","Os minutos em que você apresenta a solução e o preço.","Pitch é a apresentação organizada da solução. Estrutura: dor → solução → prova → preço → CTA. Pitch curto (30s) é para DM ou vídeo; pitch de call (5 a 10 min) é com perguntas e demonstração. Erro clássico: falar de funcionalidade em vez de resultado.","Pitch de 1 min: “Você estuda e erra a mesma coisa na prova, certo? O Orion guarda cada erro no Caderno de Erros, monta seu Plano de Estudos e corrige a redação com IA. Alunos acompanham a evolução e sabem o que revisar. A assinatura é a partir de [preço]. Quer começar hoje?”","Listar tudo que o app tem sem ligar à dor do concurseiro.","Medido pela taxa de fechamento após pitch e pelas objeções que aparecem. Se todo mundo diz “caro”, o valor ficou mal explicado.","“Em vez de estudar no escuro, você vê exatamente onde está errando. É isso que o plano entrega.”","Fechamento baixo depois da call: encurtar pitch, abrir com a dor do lead, mostrar 1 funcionalidade ligada à dor, não 8."],
["Objeção","Motivo (real ou desculpa) que o lead dá para não fechar agora.","Objeção é sinal de interesse: quem não liga não discute. Real é um motivo concreto; desculpa é a resposta automática. Técnica: validar → perguntar → resolver. Cinco comuns: Preço: validar e comparar com o custo de reprovar. Tempo: mostrar o plano curto. “Vou pensar”: perguntar o que falta decidir. “Vou falar com minha mãe/esposa”: oferecer incluir ela na conversa. “Já tenho outro material”: perguntar o que falta nele e mostrar o diferencial (Caderno de Erros).","“Tá caro.” → “Entendo, é decisão importante. Comparado com o quê? O que você mais precisa que o Orion resolva?”","Rebater na hora, discutir ou insistir.","% de objeções contornadas = fechamentos após objeção ÷ calls com objeção. Anote qual aparece mais.","“Vou pensar” → “Claro! O que ainda ficou em dúvida para você decidir com segurança?”","Muita objeção de preço: melhorar prova social e ancorar valor. Muito “vou pensar”: trazer urgência honesta e follow-up em 24h."],
["Taxa de conversão","Quantas pessoas, de um total, avançam para a próxima etapa ou compram.","Fórmula: (vendas ÷ total de leads ou calls) × 100. Existem três: lead → call, call → venda e geral (lead → venda). Medir em cada etapa mostra onde o funil vaza. Sem isso você não sabe se o problema é o conteúdo, o SDR ou o Closer.","100 leads do Orion → 40 qualificados → 20 calls marcadas → 14 calls realizadas → 4 vendas. Geral = 4%. Call → venda = 4 ÷ 14 = 28,5%.","Olhar só a conversão geral e não saber qual etapa está quebrada.","Compare etapa a etapa semana a semana. Referência inicial: lead → call 10-20%; call → venda 20-30%; geral 2-5%.","“Hoje a gente fechou 4 de 14 calls. Nossa meta é 5.”","Descobrir a etapa pior e atacar só ela: lead → call (SDR/convite), call → venda (pitch/objeções), topo (gancho)."],
["Ticket médio","Quanto, em média, cada venda rende.","Fórmula: faturamento total ÷ número de vendas. Não é o preço do plano: é a média do que foi vendido. Importa porque, com o mesmo número de leads, ticket maior significa mais receita. Sobe com plano anual, upsell (plano superior ou Coach pago) e combos.","Vendeu 10 assinaturas: 5 mensais de R$ 30 e 5 anuais de R$ 300. Total R$ 1.650 ÷ 10 = R$ 165. O preço do mensal é R$ 30, mas o ticket médio é R$ 165.","Confundir ticket médio com preço de tabela.","Ticket = faturamento ÷ vendas, acompanhado por mês. Subiu com anual = bom. Caiu = muito desconto ou só plano barato.","“Pagando o anual você economiza e já fica coberto até a prova.”","Ticket baixo: oferecer anual primeiro, mostrar upgrade, criar combo (plano + Coach), treinar o Closer para ancorar o plano maior."],
["Pipeline","A lista de todas as negociações em andamento, de quem chegou agora até quem está quase fechando.","Pipeline é o funil organizado em etapas: Novo Lead → Contatado → Qualificado → Call Marcada → Call Realizada → Proposta → Fechado/Perdido. Cada lead está em uma etapa, com próximo passo e data. Saudável tem gente em todas as etapas e ninguém parado. Vazio tem poucos leads ou concentrado no começo.","Segunda: Novo Lead 30, Contatado 18, Qualificado 9, Call Marcada 5, Call Realizada 3, Proposta 2, Fechado 1. Quem está há mais de 3 dias na mesma etapa vira alerta.","Deixar lead parado sem próximo passo, achando que ele volta sozinho.","Leads por etapa, dias parado e valor previsto. Meta: nenhum lead parado mais de 3 dias sem ação.","“Vou te chamar amanhã às 10h com a resposta, pode ser?”","Pipeline vazio: gerar mais lead qualificado (conteúdo Viral Estratégico). Pipeline travado: revisar a etapa onde acumula e reativar os parados."]];
S.adm=S.adm||{posts:[]};let AT=0,AO=null,HC="Todas",GQ="",AF={c:"PMESP",m:"Português",f:"Caderno de Erros",tp:TIP[0],g:1,t:""};
const hkf=(id,t)=>HK[id-1].t.replace(/\[(X|assunto|situação|comportamento comum)\]/g,t||"[tema]");
function adm(){S.adm=S.adm||{posts:[]};head();
A.innerHTML=`<a class="mut" href="#inicio">← Voltar ao curso</a><h1>Criador Viral Estratégico</h1><p class="mut">Área interna de criação. Sem link na home e fora do alcance do aluno por enquanto.</p><div>${["Gerador de Post","Biblioteca de Ganchos","Score de Post","Glossário Comercial"].map((n,i)=>`<button class="chip atb ${i===AT?"on":""}" data-i="${i}">${n}</button>`).join("")}</div><div id="av"></div>`;
document.querySelectorAll(".atb").forEach(b=>b.onclick=()=>{AT=+b.dataset.i;adm()});[tg,tb,ts,tl][AT]()}
const sel=(k,l,a)=>`<label class="mut" for="f_${k}">${l}</label><select id="f_${k}">${a.map(x=>`<option ${x==AF[k]?"selected":""}>${x}</option>`).join("")}</select>`;
function box(r,n){return `<div class="${n>=85?"okb":"card"}"><b>Score: ${n}/100</b> · ${qd(r)}<br>${smsg(n)}<ul>${CR.map((c,i)=>`<li>${r.s[i]?"✅":"❌"} ${c}</li>`).join("")}</ul></div>${qd(r)==="Viral Vazio"?`<div class="al">Esse post vai dar view mas não vai converter. Adicione uma questão + CTA para ${esc(AF.f)}.</div>`:""}`}
function tg(){$("av").innerHTML=`<div class="card">${sel("c","Concurso",CON)}${sel("m","Matéria",MAT)}${sel("f","Funcionalidade do Orion para promover (obrigatório)",FUN)}${sel("tp","Tipo de post",TIP)}<label class="mut" for="f_g">Tipo de gancho (27 modelos)</label><select id="f_g">${HK.map(h=>`<option value="${h.id}" ${h.id==AF.g?"selected":""}>${h.id}. ${h.c}: ${h.t.slice(0,48)}…</option>`).join("")}</select><label class="mut" for="f_t">Tema / meme base</label><textarea id="f_t" placeholder="Ex.: pegadinha de crase em prova da PMESP">${esc(AF.t)}</textarea><p><button class="btn" id="gb">Gerar Roteiro</button></p></div><div id="go"></div><h2>Posts salvos</h2><div id="pl"></div>`;
["c","m","f","tp"].forEach(k=>$("f_"+k).onchange=e=>AF[k]=e.target.value);$("f_g").onchange=e=>AF.g=+e.target.value;$("f_t").oninput=e=>AF.t=e.target.value;
$("gb").onclick=()=>{if(!AF.t.trim()){$("go").innerHTML='<div class="al">Escreva o tema ou meme base. Não fazemos post só de meme: ele precisa de questão e CTA.</div>';return}
const h=hkf(AF.g,AF.t.trim()),v=VIS[(AF.tp.split(": ")[1])||"Card 2D"],c=AF.c,cta=`CTA: “Entra no Orion e ${CTA[AF.f]}. Link na bio.”`;
const txt=`GANCHO (0-3s, texto na tela):\n${h}\n\nCENA 2 (${v}):\nTema: ${AF.t.trim()}. Mostre a situação em ${c}, sem rosto.\n\nCENA 3, QUESTÃO (${c} · ${AF.m}):\n[cole aqui a questão com alternativas]\n\nPOSICIONAMENTO (tome um lado, sem ficar em cima do muro):\n[escreva sua posição sobre ${AF.t.trim()}]\n\nCOMENTA AÍ: qual pegadinha de ${AF.m} já te derrubou em ${c}? Me conta.\n\n${cta}`;
AO={h,txt};$("go").innerHTML=`<div class="card glow"><b>Roteiro / Legenda (edite à vontade)</b><textarea id="ot" style="min-height:300px">${esc(txt)}</textarea><p><button class="btn" id="rc">Recalcular score</button> <button class="btn" id="sv">Salvar post</button> <span class="mut" id="sm"></span></p></div><div id="gs"></div>`;
const rc=()=>{const r=scr($("ot").value);$("gs").innerHTML=box(r,r.n)};rc();$("rc").onclick=rc;
$("sv").onclick=()=>{const t=$("ot").value,r=scr(t);S.adm.posts.unshift({id:Date.now(),c:AF.c,m:AF.m,f:AF.f,tp:AF.tp,g:AF.g,tema:AF.t,gancho:h,txt:t,n:r.n,q:qd(r)});save();$("sm").textContent="Salvo!";rp()}};
const rp=()=>{$("pl").innerHTML=S.adm.posts.map((p,i)=>`<div class="card"><b>${esc(p.c)} · ${esc(p.f)}</b> · ${p.n}/100 · ${p.q}<br><span class="mut">${esc(p.gancho)}</span><br><button class="chip px" data-i="${i}">Apagar</button></div>`).join("")||'<p class="mut">Nenhum post salvo.</p>';document.querySelectorAll(".px").forEach(b=>b.onclick=()=>{S.adm.posts.splice(+b.dataset.i,1);save();rp()})};rp()}
function tb(){const cs=["Todas",...HKC.map(c=>c[0])];$("av").innerHTML=`<p class="mut">27 ganchos fixos. [X] é o tema. Toque em “Usar” para levar ao gerador.</p><div>${cs.map(c=>`<button class="chip hc ${c===HC?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>${HK.filter(h=>HC==="Todas"||h.c===HC).map(h=>`<div class="card"><span class="mut">${h.id}. ${h.c}</span><br>${esc(h.t)}<br><button class="chip hu" data-i="${h.id}">Usar no gerador</button></div>`).join("")}`;
document.querySelectorAll(".hc").forEach(b=>b.onclick=()=>{HC=b.dataset.c;tb()});document.querySelectorAll(".hu").forEach(b=>b.onclick=()=>{AF.g=+b.dataset.i;AT=0;adm()})}
function ts(){$("av").innerHTML=`<div class="card"><b>Framework</b><br>Viral Vazio: alcance sem conversão (evitar). Viral Estratégico: alcance + conversão (objetivo). Conteúdo Invisível: bom sem gancho (corrigir). Autoridade em Construção: pouca view, audiência qualificada (aceitável).<br><span class="mut">Público a atrair: Cliente Ideal e Comprador Silencioso. Evitar: Fã que não compra e Seguidor Desinteressado.</span></div><label class="mut" for="st">Cole a legenda/roteiro do post</label><textarea id="st" style="min-height:200px"></textarea><div id="sr"></div>`;const f=()=>{const r=scr($("st").value);$("sr").innerHTML=box(r,r.n)};$("st").oninput=f;f()}
function tl(){$("av").innerHTML=`<label class="mut" for="gq">Buscar termo</label><input type="text" id="gq" placeholder="Ex.: lead, no-show, ticket…" value="${esc(GQ)}"><div id="gl"></div>`;const r=()=>{const q=GQ.toLowerCase();$("gl").innerHTML=GCOM.filter(g=>g.join(" ").toLowerCase().includes(q)).map(g=>`<details class="gl"><summary>${g[0]}<br><span class="mut" style="font-weight:400">${g[1]}</span></summary><p><b class="k">Explicação completa:</b> ${g[2]}</p><p><b class="k">Exemplo no Orion:</b> ${g[3]}</p><p><b class="k">Erro comum:</b> ${g[4]}</p><p><b class="k">Como medir:</b> ${g[5]}</p><p><b class="k">O vendedor fala:</b> ${g[6]}</p><p><b class="k">Quando está ruim:</b> ${g[7]}</p></details>`).join("")||'<p class="mut">Nenhum termo encontrado.</p>'};$("gq").oninput=e=>{GQ=e.target.value;r()};r()}

function route(){const h=location.hash.slice(1);if(h==="admin-criador-viral"){adm();scrollTo(0,0);return}const l=L.find(x=>"a"+x.id===h);head();l?lesson(l):home();window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
